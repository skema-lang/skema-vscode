## skemavscode — GitLab CI/CD
##
## Two kinds of pipeline.
##
## On merge requests and the default branch: typecheck, test and bundle. No
## Rust, no server binary — everything here is TypeScript, and the model
## types are committed (`shared/skema.d.ts`, see `npm run sync:types`).
##
## On a tag: one **platform-specific VSIX per platform**, each with that
## platform's `skema-lsp` pulled from the language project's package
## registry (`npm run fetch:server`), plus one **platform-neutral VSIX** with
## no server in it at all. The neutral one is not a leftover: it is what
## macOS users install until there is a macOS runner to build a Darwin
## binary on, and it works — the extension falls back to `skema.serverPath`
## or a `skema-lsp` on `PATH`.
##
## A third entry point: the language repo triggers this project when it tags
## a release, with `SKEMA_RELEASE` set to that tag. The `adopt-release` job
## then points package.json at the new server, mirrors the version, and tags
## — which starts the ordinary tag pipeline above. So a language release ends
## with a VSIX built against exactly that release, without anyone bumping
## `skemaServer.version` by hand.
##
## Prerequisites in the GitLab project settings:
##   - A `SKEMA_REGISTRY_TOKEN` CI variable (a `read_api` token for the
##     language project) if that project is private. A public one needs
##     nothing.
##   - A `RELEASE_TOKEN` CI variable, masked and protected. `CI_JOB_TOKEN`
##     cannot push, so `adopt-release` cannot commit or tag without one. Use a
##     **personal access token** with the `write_repository` scope, from an
##     account that may push to the protected default branch — *not* a project
##     access token: those are Premium on GitLab.com for projects in a group,
##     and this one sits in `skema-language`.
##   - Settings → CI/CD → Job token permissions: allow
##     `skema-language/skema` to trigger this project, or its trigger job
##     gets a 404.
##   - `VSCE_PAT` if the `publish` job below is ever enabled.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - package
  - release

default:
  image: node:22-bookworm-slim
  interruptible: true

variables:
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

check:
  stage: check
  cache: *npm_cache
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run typecheck
    # The fixture test is the one thing the compiler cannot do for us: it
    # checks that the language server's JSON still matches the vendored
    # declarations the diagram is written against.
    - npm test
    - npm run build

audit:
  stage: check
  cache: *npm_cache
  needs: []
  allow_failure: true
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high

# One VSIX per platform, each carrying that platform's server.
package:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - VSCE_TARGET:
          - linux-x64
          - win32-x64
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - GITLAB_TOKEN="$SKEMA_REGISTRY_TOKEN" npm run fetch:server -- --target "$VSCE_TARGET"
    - npx vsce package --no-dependencies --target "$VSCE_TARGET" --out "skemavscode-$VSCE_TARGET.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The fallback artifact: no bundled server, installable anywhere — including
# the platforms this pipeline cannot cross-compile for.
package-neutral:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - npx vsce package --no-dependencies --out "skemavscode-universal.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# --------------------------------------------------------------------------
# release (triggered by the language repo)
# --------------------------------------------------------------------------

# Adopts a language release: rewrite package.json, commit, tag. The tag is
# the point — it starts the `package` jobs above, which are the ones that
# build a VSIX. Nothing is packaged here.
#
# This runs in the same pipeline as `check`, and after it: the extension is
# type-checked and tested against the new server version *before* the tag
# exists, so a language release that breaks the extension leaves no tag
# behind to clean up.
adopt-release:
  stage: release
  variables:
    # Needed to tell "already adopted" from "not yet": the default shallow
    # clone carries no tags to check against.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    - if: $SKEMA_RELEASE && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if git rev-parse -q --verify "refs/tags/$SKEMA_RELEASE" >/dev/null; then
        echo "$SKEMA_RELEASE is already tagged here — nothing to adopt."
        exit 0
      fi
    - node scripts/adopt-release.mjs "$SKEMA_RELEASE"
    - git config user.email "${GITLAB_USER_EMAIL:-ci@skema-language}"
    - git config user.name "${GITLAB_USER_NAME:-skema release}"
    - git add package.json package-lock.json
    # An empty diff is normal when only the language moved and this repo
    # already pointed at that tag; the tag below is still worth having.
    # Single-quoted: a bare scalar containing ": " is read as a YAML mapping,
    # and GitLab then rejects the whole script as "not a string".
    - 'git diff --cached --quiet || git commit -m "chore(release): $SKEMA_RELEASE"'
    - 'git tag -a "$SKEMA_RELEASE" -m "chore(release): $SKEMA_RELEASE"'
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"
    - git push origin "$SKEMA_RELEASE"
