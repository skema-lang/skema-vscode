## skemavscode — GitLab CI/CD
##
## Packages `@skema/model`, `@skema/diagram`, `@skema/docs` and
## `@skema/collab-protocol` resolve through the group registry endpoint (see
## .npmrc), not `file:` sibling paths — CI has no siblings.
##
## On a tag, both platform-specific and platform-neutral VSIXes are built.
## The neutral one is intentional: macOS users install it until there is a
## macOS runner (no server needed; falls back to `skema.serverPath` or `PATH`).
##
## Release design: see CLAUDE.md, "Releasing — the chain", and
## brain/release-chain.md. In short: `skema_lib_version`/`skema_lang_version`
## inputs (never `SKEMA_VERSIONS`) drive an adoption commit, and this repo's
## own next version is derived from conventional commits by git-cliff.
##
## Prerequisites in the GitLab project settings:
##   - A `SKEMA_REGISTRY_TOKEN` CI variable (a `read_api` token for the
##     language project) if that project is private.
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository** (GA in GitLab 18.4; required for the `release` job).
##   - A `RELEASE_TRIGGER_TOKEN` CI variable, masked and protected: a pipeline
##     trigger token (Settings → CI/CD → Pipeline trigger tokens), used both
##     to start the tag pipeline after `release` pushes and, from skema-lib,
##     to start this pipeline with the inputs below.
##   - Settings → CI/CD → Job token permissions: allow
##     `skema-language/skema-lib` to trigger this project.
##   - `VSCE_PAT` if the `publish` job is enabled.

spec:
  inputs:
    skema_lib_version:
      type: string
      default: ""
      description: "skema-lib release to pin (@skema/collab-protocol, @skema/diagram, @skema/docs), e.g. v0.1.1"
      regex: '^(v[0-9]+\.[0-9]+\.[0-9]+)?$'
    skema_lang_version:
      type: string
      default: ""
      description: "skema-lang release to pin (@skema/model), e.g. v0.2.2"
      regex: '^(v[0-9]+\.[0-9]+\.[0-9]+)?$'
---

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - package
  - publish
  - release

default:
  image: node:22-bookworm-slim
  interruptible: true

variables:
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

# An input-triggered pipeline runs the `release` job's own adoption + verify
# instead: `check`/`audit` would otherwise test the manifest from before
# adoption pins land.
.skip_with_release_input: &skip_with_release_input
  if: '"$[[ inputs.skema_lib_version ]]" != "" || "$[[ inputs.skema_lang_version ]]" != ""'
  when: never

# Verified against the .sha512 GitHub publishes beside the archive - the one
# thing this job pulls from outside GitLab.
.install_git_cliff: &install_git_cliff
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends git curl ca-certificates
  - |
    GIT_CLIFF_VERSION=2.10.1
    GIT_CLIFF_ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    curl -fsSL -O "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${GIT_CLIFF_ASSET}"
    curl -fsSL -O "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${GIT_CLIFF_ASSET}.sha512"
    sha512sum -c "${GIT_CLIFF_ASSET}.sha512"
    tar xzf "$GIT_CLIFF_ASSET"
    install -m 755 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff

check:
  stage: check
  cache: *npm_cache
  rules:
    - *skip_with_release_input
    - when: on_success
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run typecheck
    # The fixture test is the one thing the compiler cannot do for us: it
    # checks that the language server's JSON still matches the declarations
    # `@skema/model` ships.
    - npm test
    - npm run build

audit:
  stage: check
  cache: *npm_cache
  needs: []
  allow_failure: true
  rules:
    - *skip_with_release_input
    - when: on_success
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high

# The bump git-cliff derives is the one thing nothing else checks, and a
# wrong one is a wrong tag pushed downstream and to the package registry.
release-test:
  stage: check
  image: debian:bookworm-slim
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script: *install_git_cliff
  script:
    - scripts/release-test.sh

# One VSIX per platform, each carrying that platform's server.
package:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - VSCE_TARGET:
          - linux-x64
          - win32-x64
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - GITLAB_TOKEN="$SKEMA_REGISTRY_TOKEN" npm run fetch:server -- --target "$VSCE_TARGET"
    - npx vsce package --no-dependencies --target "$VSCE_TARGET" --out "skemavscode-$VSCE_TARGET.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The fallback artifact: no bundled server, installable anywhere — including
# the platforms this pipeline cannot cross-compile for.
package-neutral:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - npx vsce package --no-dependencies --out "skemavscode-universal.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# --------------------------------------------------------------------------
# publish (tags only)
# --------------------------------------------------------------------------

# Uploads every VSIX built above to this project's own generic package
# registry, the same way skema itself publishes skema-lsp/skema-wasm. Job
# artifacts (see `package`/`package-neutral`) expire in a month and exist for
# quick access from the pipeline page; the registry copy is the durable one,
# with a stable URL of the form
#   .../api/v4/projects/<id>/packages/generic/skemavscode/<tag>/<file>.vsix
# Just uploads pre-built artifacts, no Node needed.
publish-generic-package:
  stage: publish
  image: curlimages/curl:latest
  # `package` runs as a matrix (linux-x64, win32-x64); naming just the job
  # pulls artifacts from every instance of it, not one arbitrarily chosen one.
  needs:
    - job: package
      artifacts: true
    - job: package-neutral
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in *.vsix; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/skemavscode/${CI_COMMIT_TAG}/${f}"
      done

# --------------------------------------------------------------------------
# release (main only: a push, "Run pipeline", or an upstream input)
# --------------------------------------------------------------------------

# Adopts whatever skema-lib handed down, then derives this repo's own next
# version from conventional commits (git-cliff) and pushes the tag. The tag
# is the point — it starts the `package` jobs above, which are the ones that
# build a VSIX. Nothing is packaged here.
#
# resource_group serializes this against itself: two releases racing would
# both compute the same "next" version from the same last tag.
release:
  stage: release
  resource_group: release
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    SKEMA_LIB_VERSION: "$[[ inputs.skema_lib_version ]]"
    SKEMA_LANG_VERSION: "$[[ inputs.skema_lang_version ]]"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ("$[[ inputs.skema_lib_version ]]" != "" || "$[[ inputs.skema_lang_version ]]" != "")'
  before_script: *install_git_cliff
  script:
    - scripts/release.sh
