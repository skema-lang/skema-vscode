## skemavscode — GitLab CI/CD
##
## Packages `@skema/model` and `@skema/diagram` used to be `file:` paths to
## sibling checkouts, which only worked on dev machines. CI has no siblings;
## npm links `file:` dependencies without checking targets, and the failure
## surfaced as "Cannot find module '@skema/model'" in tsc. Now both resolve
## through the group registry endpoint, which is public.
##
## On a tag, both platform-specific and platform-neutral VSIXes are built.
## The neutral one is intentional: macOS users install it until there is a
## macOS runner (no server needed; falls back to `skema.serverPath` or `PATH`).
##
## Release design: see CLAUDE.md, "Releasing — the chain".
##
## Prerequisites in the GitLab project settings:
##   - A `SKEMA_REGISTRY_TOKEN` CI variable (a `read_api` token for the
##     language project) if that project is private.
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository** (GA in GitLab 18.4; required for `adopt-release`).
##   - A `RELEASE_TRIGGER_TOKEN` CI variable, masked and protected: a pipeline
##     trigger token (Settings → CI/CD → Pipeline trigger tokens).
##   - Settings → CI/CD → Job token permissions: allow
##     `skema-language/skema-lib` to trigger this project.
##   - `VSCE_PAT` if the `publish` job is enabled.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - package
  - publish
  - release

default:
  image: node:22-bookworm-slim
  interruptible: true

variables:
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

check:
  stage: check
  cache: *npm_cache
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run typecheck
    # The fixture test is the one thing the compiler cannot do for us: it
    # checks that the language server's JSON still matches the declarations
    # `@skema/model` ships.
    - npm test
    - npm run build

audit:
  stage: check
  cache: *npm_cache
  needs: []
  allow_failure: true
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high

# One VSIX per platform, each carrying that platform's server.
package:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - VSCE_TARGET:
          - linux-x64
          - win32-x64
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - GITLAB_TOKEN="$SKEMA_REGISTRY_TOKEN" npm run fetch:server -- --target "$VSCE_TARGET"
    - npx vsce package --no-dependencies --target "$VSCE_TARGET" --out "skemavscode-$VSCE_TARGET.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The fallback artifact: no bundled server, installable anywhere — including
# the platforms this pipeline cannot cross-compile for.
package-neutral:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - npx vsce package --no-dependencies --out "skemavscode-universal.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# --------------------------------------------------------------------------
# publish (tags only)
# --------------------------------------------------------------------------

# Uploads every VSIX built above to this project's own generic package
# registry, the same way skema itself publishes skema-lsp/skema-wasm. Job
# artifacts (see `package`/`package-neutral`) expire in a month and exist for
# quick access from the pipeline page; the registry copy is the durable one,
# with a stable URL of the form
#   .../api/v4/projects/<id>/packages/generic/skemavscode/<tag>/<file>.vsix
# Just uploads pre-built artifacts, no Node needed.
publish-generic-package:
  stage: publish
  image: curlimages/curl:latest
  # `package` runs as a matrix (linux-x64, win32-x64); naming just the job
  # pulls artifacts from every instance of it, not one arbitrarily chosen one.
  needs:
    - job: package
      artifacts: true
    - job: package-neutral
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in *.vsix; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/skemavscode/${CI_COMMIT_TAG}/${f}"
      done

# --------------------------------------------------------------------------
# release (triggered by skema-lib)
# --------------------------------------------------------------------------

# Adopts the versions skema-lib handed down: pin, bump, commit, tag. The tag is
# the point — it starts the `package` jobs above, which are the ones that build
# a VSIX. Nothing is packaged here.
#
# The new pins are type-checked, tested and built *before* the tag exists, so
# an upstream release that breaks the extension leaves no tag behind to clean
# up.
adopt-release:
  stage: release
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: $SKEMA_VERSIONS && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # The default image is node:22-bookworm-slim: fine for the npm-only jobs
  # above, but this one also runs `git tag`/`commit`/`push` and, at the end,
  # `curl` to trigger the tag pipeline — neither ships in that image (the
  # initial GIT_STRATEGY: clone checkout is done by the runner's own helper
  # image, not this container, so it works without git; everything after
  # does not).
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
  script:
    - VERSION=$(node scripts/adopt-release.mjs "$SKEMA_VERSIONS")
    - |
      if [ -z "$VERSION" ]; then
        echo "Already on $SKEMA_VERSIONS — nothing to adopt."
        exit 0
      fi
    - npm run typecheck
    - npm test
    - npm run build
    - git config user.email "${GITLAB_USER_EMAIL:-ci@skema-language}"
    - git config user.name "${GITLAB_USER_NAME:-skema release}"
    - git add package.json package-lock.json
    # Single-quoted: a bare scalar containing ": " is read as a YAML mapping,
    # and GitLab then rejects the whole script as "not a string".
    - 'git commit -m "chore(release): $VERSION" -m "Adopts $SKEMA_VERSIONS"'
    - 'git tag -a "$VERSION" -m "chore(release): $VERSION"'
    # The job token does the pushing — no personal or project access token.
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"
    - git push origin "$VERSION"
    # A job-token push starts no pipeline, so the tag pipeline that builds the
    # VSIX has to be asked for. Without this the tag exists and nothing ships.
    - |
      curl --fail --silent --show-error --output /dev/null \
        --form "token=${RELEASE_TRIGGER_TOKEN}" \
        --form "ref=${VERSION}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
