## skemavscode — GitLab CI/CD
##
## Two kinds of pipeline.
##
## On merge requests and the default branch: typecheck, test and bundle. No
## Rust, no server binary — everything here is TypeScript. Two of the packages
## it is written against live in other projects of the group: `@skema/model`,
## generated in the language repo, and `@skema/diagram` from skema-lib. Both
## resolve through the group registry endpoint in .npmrc, which is public, so
## `npm ci` needs no token. They used to be `file:` paths to sibling checkouts,
## which only ever worked on a developer machine: CI has no siblings, npm links
## a `file:` dependency without checking that the target exists, and the whole
## failure surfaced as "Cannot find module '@skema/model'" in tsc.
##
## On a tag: one **platform-specific VSIX per platform**, each with that
## platform's `skema-lsp` pulled from the language project's package
## registry (`npm run fetch:server`), plus one **platform-neutral VSIX** with
## no server in it at all. The neutral one is not a leftover: it is what
## macOS users install until there is a macOS runner to build a Darwin
## binary on, and it works — the extension falls back to `skema.serverPath`
## or a `skema-lsp` on `PATH`. All three are then uploaded to this project's
## own generic package registry (`publish-generic-package`) so they have a
## permanent, directly downloadable URL — the `*.vsix` job artifacts above
## still exist for quick pipeline-page access, but expire in a month.
##
## A third entry point: skema-lib triggers this project whenever it publishes
## something, with `SKEMA_VERSIONS` listing exact versions ("@skema/model@0.2.1
## skema-lsp@0.2.1"). The `adopt-release` job pins the ones this extension uses
## (`skema-lsp` as `skemaServer.version`), bumps the extension's own version by
## the largest step any of them took, and tags — which starts the ordinary tag
## pipeline above. The version is this extension's own; it does not mirror the
## language's.
##
## Tagging this repo directly works too, with no `adopt-release` involved:
## bump `version`, commit, `git tag vX.Y.Z && git push origin vX.Y.Z`.
## `fetch:server` in the `package` job always bundles `skemaServer.version`.
##
## Prerequisites in the GitLab project settings:
##   - A `SKEMA_REGISTRY_TOKEN` CI variable (a `read_api` token for the
##     language project) if that project is private. A public one needs
##     nothing.
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository**. Off by default; GA in GitLab 18.4 and available on
##     every tier. This is what lets `adopt-release` commit and tag with
##     nothing but `CI_JOB_TOKEN` — no personal or project access token.
##   - A `RELEASE_TRIGGER_TOKEN` CI variable, masked and protected: a pipeline
##     trigger token (Settings → CI/CD → Pipeline trigger tokens). A job-token
##     push deliberately starts no pipeline, so the tag pipeline that packages
##     the VSIX has to be asked for explicitly.
##   - Settings → CI/CD → Job token permissions: allow
##     `skema-language/skema-lib` to trigger this project, or its handoff job
##     gets a 404.
##   - `VSCE_PAT` if the `publish` job below is ever enabled.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - package
  - publish
  - release

default:
  image: node:22-bookworm-slim
  interruptible: true

variables:
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

check:
  stage: check
  cache: *npm_cache
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run typecheck
    # The fixture test is the one thing the compiler cannot do for us: it
    # checks that the language server's JSON still matches the declarations
    # `@skema/model` ships.
    - npm test
    - npm run build

audit:
  stage: check
  cache: *npm_cache
  needs: []
  allow_failure: true
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high

# One VSIX per platform, each carrying that platform's server.
package:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - VSCE_TARGET:
          - linux-x64
          - win32-x64
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - GITLAB_TOKEN="$SKEMA_REGISTRY_TOKEN" npm run fetch:server -- --target "$VSCE_TARGET"
    - npx vsce package --no-dependencies --target "$VSCE_TARGET" --out "skemavscode-$VSCE_TARGET.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The fallback artifact: no bundled server, installable anywhere — including
# the platforms this pipeline cannot cross-compile for.
package-neutral:
  stage: package
  cache: *npm_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - npx vsce package --no-dependencies --out "skemavscode-universal.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# --------------------------------------------------------------------------
# publish (tags only)
# --------------------------------------------------------------------------

# Uploads every VSIX built above to this project's own generic package
# registry, the same way skema itself publishes skema-lsp/skema-wasm. Job
# artifacts (see `package`/`package-neutral`) expire in a month and exist for
# quick access from the pipeline page; the registry copy is the durable one,
# with a stable URL of the form
#   .../api/v4/projects/<id>/packages/generic/skemavscode/<tag>/<file>.vsix
# Just uploads pre-built artifacts, no Node needed.
publish-generic-package:
  stage: publish
  image: curlimages/curl:latest
  # `package` runs as a matrix (linux-x64, win32-x64); naming just the job
  # pulls artifacts from every instance of it, not one arbitrarily chosen one.
  needs:
    - job: package
      artifacts: true
    - job: package-neutral
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in *.vsix; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/skemavscode/${CI_COMMIT_TAG}/${f}"
      done

# --------------------------------------------------------------------------
# release (triggered by skema-lib)
# --------------------------------------------------------------------------

# Adopts the versions skema-lib handed down: pin, bump, commit, tag. The tag is
# the point — it starts the `package` jobs above, which are the ones that build
# a VSIX. Nothing is packaged here.
#
# The new pins are type-checked, tested and built *before* the tag exists, so
# an upstream release that breaks the extension leaves no tag behind to clean
# up.
adopt-release:
  stage: release
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: $SKEMA_VERSIONS && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # The default image is node:22-bookworm-slim: fine for the npm-only jobs
  # above, but this one also runs `git tag`/`commit`/`push` and, at the end,
  # `curl` to trigger the tag pipeline — neither ships in that image (the
  # initial GIT_STRATEGY: clone checkout is done by the runner's own helper
  # image, not this container, so it works without git; everything after
  # does not).
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
  script:
    - VERSION=$(node scripts/adopt-release.mjs "$SKEMA_VERSIONS")
    - |
      if [ -z "$VERSION" ]; then
        echo "Already on $SKEMA_VERSIONS — nothing to adopt."
        exit 0
      fi
    - npm run typecheck
    - npm test
    - npm run build
    - git config user.email "${GITLAB_USER_EMAIL:-ci@skema-language}"
    - git config user.name "${GITLAB_USER_NAME:-skema release}"
    - git add package.json package-lock.json
    # Single-quoted: a bare scalar containing ": " is read as a YAML mapping,
    # and GitLab then rejects the whole script as "not a string".
    - 'git commit -m "chore(release): $VERSION" -m "Adopts $SKEMA_VERSIONS"'
    - 'git tag -a "$VERSION" -m "chore(release): $VERSION"'
    # The job token does the pushing — no personal or project access token.
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"
    - git push origin "$VERSION"
    # A job-token push starts no pipeline, so the tag pipeline that builds the
    # VSIX has to be asked for. Without this the tag exists and nothing ships.
    - |
      curl --fail --silent --show-error --output /dev/null \
        --form "token=${RELEASE_TRIGGER_TOKEN}" \
        --form "ref=${VERSION}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
