## skemavscode — GitLab CI/CD
##
## Packages `@skema/model`, `@skema/diagram`, `@skema/docs` and
## `@skema/collab-protocol` resolve through the group registry endpoint (see
## .npmrc), not `file:` sibling paths — CI has no siblings.
##
## Packaging builds three VSIXes: `linux-x64` and `win32-x64` each bundle
## that platform's `skema-lsp` (scripts/fetch-server.mjs); the neutral one
## ships with none and falls back to `skema.serverPath` or `PATH` — the only
## option until there is a macOS runner.
##
## Release design: see CLAUDE.md, "Releasing — the chain", and
## brain/release-chain.md. skema-vscode is the end of the chain — it adopts,
## it hands nothing further down.
##
## Prerequisites in the GitLab project settings:
##   - A `SKEMA_REGISTRY_TOKEN` CI variable (a `read_api` token for the
##     language project) if that project is private — fetch-server.mjs needs
##     it to download skema-lsp.
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository**, so the `release`/`adopt` jobs can push commits and
##     tags.
##   - Job token allowlist: allow `skema-language/skema-lib` to trigger this
##     project, or a hand-down 404s.
##   - `VSCE_PAT` if a Marketplace `publish` job is ever added (out of scope
##     here).

spec:
  inputs:
    skema_lib_version:
      type: string
      default: ""
      description: "skema-lib release to adopt (@skema/collab-protocol, @skema/diagram, @skema/docs), e.g. v0.1.1"
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'
    skema_lang_version:
      type: string
      default: ""
      description: "skema-lang release to adopt (@skema/model), e.g. v0.2.3"
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'
    republish_version:
      type: string
      default: ""
      description: "Existing own-release vX.Y.Z(-rc.N) to re-run the publish steps for"
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'

---

include:
  - component: $CI_SERVER_FQDN/skema-language/skema-ci/release@0.1.0
    inputs:
      version_file_kind: npm
      version_file_paths: "package.json package-lock.json"
      generic_package_name: skemavscode
      asset_globs: "*.vsix"
      adopt_groups: >-
        [{"label":"skema-lib","version":"$[[ inputs.skema_lib_version ]]","packages":["@skema/collab-protocol","@skema/diagram","@skema/docs"]},
         {"label":"skema","version":"$[[ inputs.skema_lang_version ]]","packages":["@skema/model"]}]
      verify_command: "npm ci && npm run typecheck && npm test && npm run build"
      republish_version: $[[ inputs.republish_version ]]
      adopt_stage: check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - version
  - package
  - release
  - handoff

default:
  image: node:22-bookworm-slim
  interruptible: true

variables:
  npm_config_cache: ${CI_PROJECT_DIR}/.npm

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

# An adoption-triggered pipeline (skema_lib_version/skema_lang_version set)
# runs only the component's `adopt` job against the pre-adoption manifest;
# these jobs would just redo that work against stale versions.
.skip_with_adopt_input: &skip_with_adopt_input
  if: '"$[[ inputs.skema_lib_version ]]" != "" || "$[[ inputs.skema_lang_version ]]" != ""'
  when: never

audit:
  stage: check
  cache: *npm_cache
  needs: []
  rules:
    - *skip_with_adopt_input
    - when: on_success
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm audit --audit-level=high
  allow_failure: true

# The fixture test is the one thing the compiler cannot do for us: it checks
# that the language server's JSON still matches the declarations
# `@skema/model` ships.
check:
  stage: check
  cache: *npm_cache
  needs: []
  rules:
    - *skip_with_adopt_input
    - when: on_success
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run typecheck
    - npm test
    - npm run build

# One VSIX per platform, each carrying that platform's server. Needs
# `version`'s patched package.json for both the real RELEASE_VERSION (name)
# and the version the manifest inside the VSIX itself carries.
package:
  stage: package
  cache: *npm_cache
  needs:
    - job: version
      artifacts: true
      optional: true
  rules:
    - *skip_with_adopt_input
    - when: on_success
  parallel:
    matrix:
      - VSCE_TARGET:
          - linux-x64
          - win32-x64
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - GITLAB_TOKEN="$SKEMA_REGISTRY_TOKEN" npm run fetch:server -- --target "$VSCE_TARGET"
    - npx vsce package --no-dependencies --target "$VSCE_TARGET" --out "skema-v${RELEASE_VERSION:-0.0.0-dev}-${VSCE_TARGET}.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The fallback artifact: no bundled server, installable anywhere — including
# the platforms this pipeline cannot cross-compile for.
package-neutral:
  stage: package
  cache: *npm_cache
  needs:
    - job: version
      artifacts: true
      optional: true
  rules:
    - *skip_with_adopt_input
    - when: on_success
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npm run build
    - npx vsce package --no-dependencies --out "skema-v${RELEASE_VERSION:-0.0.0-dev}.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 month

# The component's own `release` job globs `asset_globs` from its own job's
# workspace, so it needs the VSIXes downloaded into it - GitLab merges a
# same-named job key by key, so this overrides only `needs`, keeping the
# component's image/stage/rules/script/artifacts as they are.
release:
  needs:
    - job: version
      artifacts: true
    - job: package
      artifacts: true
    - job: package-neutral
      artifacts: true
